services:
  app:
    image: squilla:local
    build: .
    # LOCAL DEVELOPMENT ONLY — production deploys use coolify-compose.yml
    # or starter/docker-compose.yml. Bound to loopback so a dev box on a
    # shared network doesn't expose a development-mode CMS.
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      PORT: "8099"
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: squilla
      DB_PASSWORD: squilla_secret
      DB_NAME: squilla
      DB_SSLMODE: disable
      SESSION_EXPIRY_HOURS: "24"
      MONITOR_BEARER_TOKEN: change-me-to-a-random-token
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/storage
      # First-boot admin. Leave ADMIN_PASSWORD unset and a random password
      # is generated and printed to the logs once. The smoke tests in
      # cmd/squilla expect admin123: run `ADMIN_PASSWORD=admin123 docker
      # compose up` on a fresh database for them. Never commit a password
      # here — production config validation rejects admin123.
      ADMIN_EMAIL: admin@squilla.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./storage:/app/storage
      # Persistent operator data — themes installed via git/zip/MCP and
      # operator-deployed extensions live here so they survive container
      # restarts. Image-bundled themes and extensions stay in /app/themes
      # and /app/extensions (read-only intent); the scanner reads both.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    # Loopback only: reachable from host tools (psql, IDE) but not the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: squilla
      POSTGRES_PASSWORD: squilla_secret
      POSTGRES_DB: squilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squilla"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
