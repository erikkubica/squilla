services:
  app:
    image: ghcr.io/erikkubica/squilla:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8099}:8099"
    environment:
      PORT: "8099"
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-squilla}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      DB_NAME: ${DB_NAME:-squilla}
      DB_SSLMODE: disable
      SESSION_EXPIRY_HOURS: "24"
      # Required in production (APP_ENV=production refuses to boot without them).
      MONITOR_BEARER_TOKEN: ${MONITOR_BEARER_TOKEN:?Set MONITOR_BEARER_TOKEN in .env}
      SQUILLA_SECRET_KEY: ${SQUILLA_SECRET_KEY:?Set SQUILLA_SECRET_KEY in .env (openssl rand -base64 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env (your public site URL)}
      # Public origin for links in emails (password reset). Falls back to
      # the site_url setting; production never uses the request Host.
      SQUILLA_PUBLIC_URL: ${SQUILLA_PUBLIC_URL:-}
      # Set when running behind a TLS-terminating proxy so cookies get
      # the Secure flag and HSTS is sent.
      TRUST_FORWARDED_PROTO: ${TRUST_FORWARDED_PROTO:-false}
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Persistent storage for uploads and media
      - squilla-storage:/app/storage
      # Persistent operator data (runtime state, uploaded extensions/themes)
      - squilla-data:/app/data
      # Mount custom themes directly from this repo into the container
      - ./themes:/app/data/themes
      # Mount custom extensions directly from this repo (optional)
      - ./extensions:/app/data/extensions
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No published port: the app reaches Postgres over the compose network.
    # For local access add `ports: ["127.0.0.1:5432:5432"]` — never bind
    # 5432 on all interfaces.
    environment:
      POSTGRES_USER: ${DB_USER:-squilla}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-squilla}
    volumes:
      - squilla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-squilla} -d ${DB_NAME:-squilla}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  squilla-storage:
  squilla-data:
  squilla-pgdata:
