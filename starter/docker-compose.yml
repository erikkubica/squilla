services:
  app:
    image: ghcr.io/erikkubica/squilla:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8099}:8099"
    environment:
      PORT: "8099"
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-squilla}
      DB_PASSWORD: ${DB_PASSWORD:-squilla_secret}
      DB_NAME: ${DB_NAME:-squilla}
      DB_SSLMODE: disable
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-random-64-char-string}
      SESSION_EXPIRY_HOURS: "24"
      MONITOR_BEARER_TOKEN: ${MONITOR_BEARER_TOKEN:-change-me-to-a-random-token}
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Persistent storage for uploads and media
      - squilla-storage:/app/storage
      # Persistent operator data (runtime state, uploaded extensions/themes)
      - squilla-data:/app/data
      # Mount custom themes directly from this repo into the container
      - ./themes:/app/data/themes
      # Mount custom extensions directly from this repo (optional)
      - ./extensions:/app/data/extensions
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-squilla}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-squilla_secret}
      POSTGRES_DB: ${DB_NAME:-squilla}
    volumes:
      - squilla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-squilla} -d ${DB_NAME:-squilla}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  squilla-storage:
  squilla-data:
  squilla-pgdata:
